# Production images of the API, worker and web app, with throwaway
# PostgreSQL and Redis, for the end-to-end tests:
#
#   pnpm e2e stack:up && pnpm e2e test:e2e && pnpm e2e stack:down
#
# Ports are offset so the stack can run next to a dev setup.
name: openathlete-e2e

x-api-env: &api-env
  ENV: production
  NODE_ENV: production
  DATABASE_URL: postgresql://oa:oa@postgres:5432/oa?schema=public
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: e2e-jwt-secret-key-at-least-32-characters-long
  HASH_PEPPER: e2e-pepper-at-least-32-characters-long-xxxx
  APP_URL: http://localhost:18080
  CORS_ORIGINS: http://localhost:18080
  # Users can point AI features at the fake-llm service
  AI_ALLOW_CUSTOM_ENDPOINTS: 'true'
  # Default remains bare/off; opt in only for the targeted real-startup smoke.
  GARMIN_PERSONAL_API_ENABLED: '${E2E_GARMIN_PERSONAL_API_ENABLED:-false}'

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: oa
      POSTGRES_DB: oa
    ports: ['127.0.0.1:15435:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oa -d oa']
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 20

  api:
    image: openathlete-api:e2e
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-env
      # Background jobs run in the worker, as in production
      ENABLE_ACTIVITY_IMPORT: 'false'
      ENABLE_ACTIVITY_PROCESSING: 'false'
      ENABLE_TRAINING_LOAD_ESTIMATION: 'false'
      # Single sign-on through the fake-oidc service
      OIDC_ISSUER: http://fake-oidc:9000
      OIDC_CLIENT_ID: openathlete-e2e
      OIDC_CLIENT_SECRET: e2e-oidc-secret
      OIDC_NAME: Fake IdP
    ports: ['127.0.0.1:13000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      fake-oidc: { condition: service_healthy }

  worker:
    image: openathlete-api:e2e
    environment:
      <<: *api-env
      SKIP_MIGRATIONS: 'true'
      ENABLE_ACTIVITY_IMPORT: 'true'
      ENABLE_ACTIVITY_PROCESSING: 'true'
      ENABLE_TRAINING_LOAD_ESTIMATION: 'false'
    depends_on:
      api: { condition: service_healthy }

  # OpenAI-compatible stand-in for AI providers (see fake-llm/server.mjs)
  fake-llm:
    image: node:22-alpine
    command: ['node', '/srv/server.mjs']
    volumes:
      - ./fake-llm/server.mjs:/srv/server.mjs:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:8080/health || exit 1']
      interval: 3s
      retries: 20

  # OpenID Connect provider for single sign-on (see fake-oidc/server.mjs):
  # the API reaches it as fake-oidc, the browser on port 19000
  fake-oidc:
    image: node:22-alpine
    command: ['node', '/srv/server.mjs']
    volumes:
      - ./fake-oidc/server.mjs:/srv/server.mjs:ro
    ports: ['127.0.0.1:19000:9000']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:9000/health || exit 1']
      interval: 3s
      retries: 20

  web:
    image: openathlete-web:e2e
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    # No API_PUBLIC_URL: the app reaches the API through the image's /api
    # proxy, as in the self-hosting setup
    ports: ['127.0.0.1:18080:80']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1/ || exit 1']
      interval: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }
