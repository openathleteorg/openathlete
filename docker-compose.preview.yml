# =============================================================================
# OpenAthlete - pull request preview, deployed by Coolify
# =============================================================================
# One stack per pull request, built from its sources: PostgreSQL, Redis, the
# API and its worker, the web app (which forwards /api to the API, as in
# self-hosting), a one-shot seed and Mailpit, which catches every email.
# Settings and variables: deploy/coolify/PREVIEW.md.
#
# Nothing is published on the host: Coolify routes the domains of web and
# mailpit through Traefik, behind basic auth. Locally:
#
#   PREVIEW_BASIC_AUTH="$(htpasswd -nbB preview secret)" \
#     docker compose -f docker-compose.preview.yml up --build
#
# Rules this file keeps:
# - Hosts are the SERVICE_NAME_* names Coolify generates for the preview, so
#   a preview never reaches another stack's containers, even on a shared
#   network.
# - Integration, billing, AI, storage and analytics keys are written empty,
#   not read from variables: Docker Compose reads the repository's .env, and
#   Coolify can hand a preview the production variables.
# - Secrets are Coolify magic variables (SERVICE_PASSWORD_*, SERVICE_HEX_*),
#   generated by Coolify; the defaults only serve local runs.
# =============================================================================

# Coolify replaces it with <uuid>-pr-<id>; locally it keeps the preview away
# from the volumes of the other compose files
name: openathlete-preview

x-database-url: &database-url postgresql://openathlete:${SERVICE_PASSWORD_POSTGRES:-preview}@${SERVICE_NAME_POSTGRES:-postgres}:5432/openathlete
x-redis-url: &redis-url redis://${SERVICE_NAME_REDIS:-redis}:6379/0
x-hash-pepper: &hash-pepper ${SERVICE_PASSWORD_64_PEPPER:-local-preview-pepper}

# The API and the worker: everything but which jobs they run
x-api-environment: &api-environment
  ENV: preview
  NODE_ENV: production
  PORT: "3000"
  DATABASE_URL: *database-url
  REDIS_URL: *redis-url
  HASH_PEPPER: *hash-pepper
  JWT_SECRET_KEY: ${SERVICE_PASSWORD_64_JWT:-local-preview-jwt-secret-only-for-docker-compose-up}
  # The web service's public URL: the preview's own domain in a preview
  APP_URL: ${SERVICE_URL_WEB:-http://localhost}
  FRONTEND_URL: ${SERVICE_URL_WEB:-http://localhost}
  SIGNUP_MODE: open

  # Every email goes to Mailpit
  SMTP_HOST: ${SERVICE_NAME_MAILPIT:-mailpit}
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  EMAIL_FROM: preview@openathlete.org
  EMAIL_FROM_NAME: OpenAthlete preview
  # Empty: no lifecycle emails (onboarding, recaps)
  EMAIL_SIGNATURE: ""
  SIGNUP_NOTIFICATION_EMAIL: ""
  BREVO_API_KEY: ""

  # Off, as on a self-hosted instance without keys
  STRAVA_CLIENT_ID: ""
  STRAVA_CLIENT_SECRET: ""
  POLAR_CLIENT_ID: ""
  POLAR_CLIENT_SECRET: ""
  GARMIN_CLIENT_ID: ""
  GARMIN_CLIENT_SECRET: ""
  SUUNTO_CLIENT_ID: ""
  SUUNTO_CLIENT_SECRET: ""
  SUUNTO_SUBSCRIPTION_KEY: ""
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PRICE_SUPPORTER_MONTHLY: ""
  STRIPE_PRICE_SUPPORTER_YEARLY: ""
  APPLE_IAP_APP_ID: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GOOGLE_GENERATIVE_AI_API_KEY: ""
  MISTRAL_API_KEY: ""
  OPENROUTER_API_KEY: ""
  AI_MODEL_DEFAULT: ""
  AI_HOSTED_ACCESS: ""
  S3_BUCKET: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_ENDPOINT: ""
  FIREBASE_FUNCTIONS_URL: ""
  FIREBASE_SERVICE_ACCOUNT_JSON: ""
  POSTHOG_PROJECT_TOKEN: ""

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: openathlete
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-preview}
      POSTGRES_DB: openathlete
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openathlete -d openathlete"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # HTTP API; runs the migrations at start, no background jobs
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *api-environment
      ENABLE_ACTIVITY_IMPORT: "false"
      ENABLE_ACTIVITY_PROCESSING: "false"
      ENABLE_TRAINING_LOAD_ESTIMATION: "false"
      SKIP_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The API's image again, running the background jobs. Built rather than
  # sharing an image name: Coolify tags each built service per pull request.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *api-environment
      ENABLE_ACTIVITY_IMPORT: "true"
      ENABLE_ACTIVITY_PROCESSING: "true"
      ENABLE_TRAINING_LOAD_ESTIMATION: "true"
      SKIP_MIGRATIONS: "true"
    depends_on:
      api:
        condition: service_healthy

  # Fills the empty database with the screenshot accounts once the API has
  # migrated it, waits for the worker to process the activities, and exits.
  # --once: a database it already seeded is left as it is, so redeploying the
  # pull request keeps what testers changed. It still refuses a database
  # holding accounts it did not create.
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: seed
    # "no" also leaves it out of Coolify's health status once it exits
    restart: "no"
    command: ["--once"]
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      HASH_PEPPER: *hash-pepper
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # The app calls the API through this container's /api proxy
      API_PUBLIC_URL: ""
      API_UPSTREAM: ${SERVICE_NAME_API:-api}:3000
      # Unused by the app: Coolify generates a magic variable only when an
      # environment value names it, and the labels below need this one
      PREVIEW_ACCESS_TOKEN: ${SERVICE_HEX_32_PREVIEWACCESS:-local}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    # Coolify adds these middlewares to the routers it generates for the
    # web domain. Names start with the Compose project (<uuid>-pr-<id> in a
    # preview): Traefik drops a middleware or router that two previews
    # define differently.
    labels:
      - 'traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-web-auth.basicauth.users=${PREVIEW_BASIC_AUTH:?Set PREVIEW_BASIC_AUTH (htpasswd format), see deploy/coolify/PREVIEW.md}'
      - 'traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-web-headers.headers.customresponseheaders.X-Robots-Tag=noindex'
      # Proof of basic auth for the router below
      - 'traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-web-headers.headers.customresponseheaders.Set-Cookie=oa_preview=${SERVICE_HEX_32_PREVIEWACCESS:-local}; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax'
      # The app sends its own Authorization header (Bearer) to /api, which
      # basic auth would refuse. Those calls skip basic auth only with the
      # cookie a basic-authenticated page set.
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME}-web-api.rule=Host(`${SERVICE_FQDN_WEB:-localhost}`) && PathPrefix(`/api/`) && HeaderRegexp(`Authorization`, `^Bearer `) && HeaderRegexp(`Cookie`, `(^|[; ])oa_preview=${SERVICE_HEX_32_PREVIEWACCESS:-local}\b`)'
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME}-web-api.entrypoints=https'
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME}-web-api.tls=true'
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME}-web-api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME}-web-api.middlewares=${COMPOSE_PROJECT_NAME}-web-headers'
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME}-web-api.service=${COMPOSE_PROJECT_NAME}-web'
      - 'traefik.http.services.${COMPOSE_PROJECT_NAME}-web.loadbalancer.server.port=80'

  # Inbox of every email the preview sends (web UI on port 8025)
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
    labels:
      - 'traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-mailpit-auth.basicauth.users=${PREVIEW_BASIC_AUTH:?Set PREVIEW_BASIC_AUTH (htpasswd format), see deploy/coolify/PREVIEW.md}'
      - 'traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-mailpit-headers.headers.customresponseheaders.X-Robots-Tag=noindex'

volumes:
  postgres_data:
  redis_data:
