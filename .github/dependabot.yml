version: 2

# Security updates are always raised individually. Version updates are
# grouped monthly so they arrive as a few reviewable PRs instead of dozens,
# and each merge rebuilds the deployed apps (Vercel build minutes, the API
# image on the server).
# Major versions are left out of version updates: they need a planned
# migration (Nest, Capacitor, Prisma, Mastra...), not an automatic PR.
updates:
  - package-ecosystem: npm
    directory: /
    # Standalone projects with their own lockfile or package manager
    exclude-paths:
      - apps/docs/**
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Stripe SDK versions pin a Stripe API version: upgrade deliberately
      - dependency-name: stripe
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      docs:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Later 14.x releases overflow the stack while building pages with
      # includeProcessedMarkdown; drop this once a release builds again
      - dependency-name: fumadocs-mdx
        versions: ['> 14.2.3']

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: monthly
    groups:
      base-images:
        patterns: ['*']
    ignore:
      # Stay on the Node.js LTS line used by .nvmrc; move majors deliberately
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
