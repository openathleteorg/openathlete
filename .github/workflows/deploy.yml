name: Deploy API to Scaleway

on:
  push:
    branches: [ "main" ]

env:
  SCW_REGION: ${{ secrets.SCW_DEFAULT_REGION || 'fr-par' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PNPM
        uses: pnpm/action-setup@v4
        # Version is automatically detected from package.json "packageManager" field

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Debug env values
        run: |
          set -x
          echo "SCW_REGION=${SCW_REGION}"
          echo "REGISTRY_NAMESPACE=${{ secrets.REGISTRY_NAMESPACE }}"
          echo "REGISTRY=rg.${SCW_REGION}.scw.cloud"
          echo "IMAGE_PATH=${{ secrets.REGISTRY_NAMESPACE }}/openathlete"

      - name: Verify namespace exists (Scaleway API)
        run: |
          set -x
          curl -sS -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/registry/v1/regions/${SCW_REGION}/namespaces" | jq '.'
          echo "Fetching details for namespace name='${{ secrets.REGISTRY_NAMESPACE }}' (if present)"
          curl -sS -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/registry/v1/regions/${SCW_REGION}/namespaces?name=${{ secrets.REGISTRY_NAMESPACE }}" | jq '.'
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}

      - name: Docker login to Scaleway registry
        run: |
          set -x
          # Scaleway Container Registry authentication
          # Try with Access Key first, fallback to nologin
          echo "${SCW_SECRET_KEY}" | docker login "rg.${SCW_REGION}.scw.cloud" --username "${SCW_ACCESS_KEY}" --password-stdin || \
          echo "${SCW_SECRET_KEY}" | docker login "rg.${SCW_REGION}.scw.cloud" --username "nologin" --password-stdin
          docker logout || true
          # Re-login and verify
          echo "${SCW_SECRET_KEY}" | docker login "rg.${SCW_REGION}.scw.cloud" --username "${SCW_ACCESS_KEY}" --password-stdin || \
          echo "${SCW_SECRET_KEY}" | docker login "rg.${SCW_REGION}.scw.cloud" --username "nologin" --password-stdin
          docker info
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build Docker image
        run: |
          set -x
          IMAGE_SHA="rg.${SCW_REGION}.scw.cloud/${{ secrets.REGISTRY_NAMESPACE }}/openathlete:${GITHUB_SHA}"
          IMAGE_LATEST="rg.${SCW_REGION}.scw.cloud/${{ secrets.REGISTRY_NAMESPACE }}/openathlete:latest"
          echo "Building images: $IMAGE_SHA and $IMAGE_LATEST"
          docker build -f apps/api/Dockerfile -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .

      - name: Show local images
        run: |
          set -x
          docker images | grep -E "openathlete"

      - name: Push Docker image
        run: |
          set -x
          IMAGE_SHA="rg.${SCW_REGION}.scw.cloud/${{ secrets.REGISTRY_NAMESPACE }}/openathlete:${GITHUB_SHA}"
          IMAGE_LATEST="rg.${SCW_REGION}.scw.cloud/${{ secrets.REGISTRY_NAMESPACE }}/openathlete:latest"
          echo "Pushing $IMAGE_SHA"
          docker push "$IMAGE_SHA"
          echo "Pushing $IMAGE_LATEST"
          docker push "$IMAGE_LATEST"

      - name: Update Serverless Container image
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_REGION: ${{ env.SCW_REGION }}
          CONTAINER_ID: ${{ secrets.CONTAINER_ID }}
        run: |
          set -x
          IMAGE="rg.${SCW_REGION}.scw.cloud/${{ secrets.REGISTRY_NAMESPACE }}/openathlete:${GITHUB_SHA}"
          
          # Handle CONTAINER_ID format: could be "region/id" or just "id"
          if [[ "$CONTAINER_ID" == *"/"* ]]; then
            # Format: "fr-par/xxx-xxx-xxx" - extract just the ID part
            CONTAINER_ID_ONLY="${CONTAINER_ID#*/}"
            echo "Container ID format detected: region/id, using ID only: ${CONTAINER_ID_ONLY}"
          else
            # Format: just the ID
            CONTAINER_ID_ONLY="${CONTAINER_ID}"
            echo "Container ID format: ID only: ${CONTAINER_ID_ONLY}"
          fi
          
          echo "Updating container ${CONTAINER_ID_ONLY} (region: ${SCW_REGION}) to image ${IMAGE}"
          
          # List all containers to debug
          echo "Listing all containers in namespace..."
          curl -sS -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/serverless-containers/v1beta1/regions/${SCW_REGION}/containers" | jq '.containers[] | {id, name, status}'
          
          # Get current container state
          echo "Fetching current container state..."
          curl -sS -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/serverless-containers/v1beta1/regions/${SCW_REGION}/containers/${CONTAINER_ID_ONLY}" | jq '.' || echo "Container not found with ID: ${CONTAINER_ID_ONLY}"
          
          # Update container image
          echo "Updating container image..."
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X PATCH \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "https://api.scaleway.com/serverless-containers/v1beta1/regions/${SCW_REGION}/containers/${CONTAINER_ID_ONLY}" \
            -d "{\"registry_image\":\"${IMAGE}\"}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "$BODY" | jq '.'
          
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "Error: Failed to update container (HTTP $HTTP_CODE)"
            echo "Please verify:"
            echo "  1. CONTAINER_ID secret is correct (run: cd infra && tofu output container_id)"
            echo "  2. Container exists in region ${SCW_REGION}"
            echo "  3. Access Key has proper permissions"
            exit 1
          fi
          
          echo "Container update initiated successfully. Deployment should start automatically."


