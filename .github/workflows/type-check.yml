name: Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  type-check:
    name: TypeScript type checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Generate Prisma client
        run: pnpm database run db:generate
        shell: bash

      - name: Generate Paraglide messages (web)
        working-directory: apps/web
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/paraglide
        shell: bash

      - name: Generate Paraglide messages (website)
        run: pnpm website translate
        shell: bash

      - name: Run type check
        run: pnpm tsc:check
        shell: bash

