# =============================================================================
# OpenAthlete - self-hosting with Docker Compose
# =============================================================================
# Runs the published images. Quick start (see the self-hosting guide):
#
#   curl -fsSL https://raw.githubusercontent.com/openathleteorg/openathlete/main/scripts/install.sh | sh
#
# or, by hand: copy .env.example to .env, set the two secrets, then
#
#   docker compose up -d
#
# The app and its API share one address: the web container serves the app and
# forwards /api to the API, so only APP_URL needs to be set. With
# COMPOSE_PROFILES=https, Caddy serves DOMAIN over HTTPS with automatic
# certificates.
#
# To build the images from this repository instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# =============================================================================

x-api-image: &api-image ghcr.io/openathleteorg/openathlete-api:${OPENATHLETE_VERSION:-1}

services:
  # PostgreSQL with the pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: openathlete
      # Only reachable from the other containers. Instances created before
      # October 2026 used this default: keep it, or change it in the database
      # first.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openathlete_dev_password}
      POSTGRES_DB: openathlete
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openathlete"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - openathlete-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - openathlete-network

  # API, with the background jobs (device sync, processing)
  api:
    image: *api-image
    ports:
      # Only for a reverse proxy on this host; browsers use APP_URL/api.
      # API_PORT=3000 publishes it on every interface (former setups).
      - "${API_PORT:-127.0.0.1:3000}:3000"
    environment:
      ENV: ${ENV:-production}
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: postgresql://openathlete:${POSTGRES_PASSWORD:-openathlete_dev_password}@postgres:5432/openathlete
      REDIS_URL: redis://redis:6379/0

      # Required, set them in .env (see .env.example)
      HASH_PEPPER: ${HASH_PEPPER:?Set HASH_PEPPER in .env, see .env.example}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env, see .env.example}

      # Where users open OpenAthlete: email links, allowed origins and device
      # callback URLs follow it
      APP_URL: ${APP_URL:-http://localhost}
      FRONTEND_URL: ${APP_URL:-http://localhost}
      # open, invite or closed (the first account is always allowed)
      SIGNUP_MODE: ${SIGNUP_MODE:-open}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}

      # Device integrations (optional). Callback and webhook URLs default to
      # APP_URL/auth/callback/<provider> and APP_URL/api/provider/<provider>/webhook
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-}
      STRAVA_WEBHOOK_TOKEN: ${STRAVA_WEBHOOK_TOKEN:-}
      POLAR_CLIENT_ID: ${POLAR_CLIENT_ID:-}
      POLAR_CLIENT_SECRET: ${POLAR_CLIENT_SECRET:-}
      POLAR_REDIRECT_URI: ${POLAR_REDIRECT_URI:-}
      POLAR_WEBHOOK_URL: ${POLAR_WEBHOOK_URL:-}
      POLAR_WEBHOOK_SECRET_KEY: ${POLAR_WEBHOOK_SECRET_KEY:-}
      GARMIN_CLIENT_ID: ${GARMIN_CLIENT_ID:-}
      GARMIN_CLIENT_SECRET: ${GARMIN_CLIENT_SECRET:-}
      GARMIN_REDIRECT_URI: ${GARMIN_REDIRECT_URI:-}
      SUUNTO_CLIENT_ID: ${SUUNTO_CLIENT_ID:-}
      SUUNTO_CLIENT_SECRET: ${SUUNTO_CLIENT_SECRET:-}
      SUUNTO_REDIRECT_URI: ${SUUNTO_REDIRECT_URI:-}
      SUUNTO_SUBSCRIPTION_KEY: ${SUUNTO_SUBSCRIPTION_KEY:-}
      COROS_CLIENT_ID: ${COROS_CLIENT_ID:-}
      COROS_CLIENT_SECRET: ${COROS_CLIENT_SECRET:-}
      COROS_REDIRECT_URI: ${COROS_REDIRECT_URI:-}

      # Email (Brevo, optional)
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      SIGNUP_NOTIFICATION_EMAIL: ${SIGNUP_NOTIFICATION_EMAIL:-}

      # AI (optional): users can bring their own keys in Settings > AI; keys
      # here are the instance's, see .env.example
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL_DEFAULT: ${AI_MODEL_DEFAULT:-}
      AI_HOSTED_ACCESS: ${AI_HOSTED_ACCESS:-}
      AI_HOSTED_MONTHLY_BUDGET_USD: ${AI_HOSTED_MONTHLY_BUDGET_USD:-}
      AI_ALLOW_CUSTOM_ENDPOINTS: ${AI_ALLOW_CUSTOM_ENDPOINTS:-}

      # Billing (Stripe, not needed for self-hosting)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_PRICE_SUPPORTER_MONTHLY: ${STRIPE_PRICE_SUPPORTER_MONTHLY:-}
      STRIPE_PRICE_SUPPORTER_YEARLY: ${STRIPE_PRICE_SUPPORTER_YEARLY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APPLE_IAP_APP_ID: ${APPLE_IAP_APP_ID:-}

      # Push notifications (optional)
      FIREBASE_FUNCTIONS_URL: ${FIREBASE_FUNCTIONS_URL:-}

      # Background jobs (device sync needs import and processing)
      ENABLE_ACTIVITY_IMPORT: ${ENABLE_ACTIVITY_IMPORT:-true}
      ENABLE_ACTIVITY_PROCESSING: ${ENABLE_ACTIVITY_PROCESSING:-true}
      ENABLE_TRAINING_LOAD_ESTIMATION: ${ENABLE_TRAINING_LOAD_ESTIMATION:-false}

      # Error monitoring (optional)
      BETTER_STACK_DSN: ${BETTER_STACK_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openathlete-network

  # Web app, forwarding /api and /socket.io to the API
  web:
    image: ghcr.io/openathleteorg/openathlete-web:${OPENATHLETE_VERSION:-1}
    environment:
      # Leave empty: the app calls the API through /api. Only set it to serve
      # the API from another address.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openathlete-network

  # HTTPS with automatic certificates (COMPOSE_PROFILES=https and DOMAIN).
  # Then set WEB_PORT=127.0.0.1:8080 so the web container leaves ports 80
  # and 443 to Caddy.
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to web:80
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - openathlete-network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  openathlete-network:
    driver: bridge
